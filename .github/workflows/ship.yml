name: Rust

on:
  push:
    branches: [ "main", "open-svpflow" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-win:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-2022]
    
    steps:

    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - uses: Swatinem/rust-cache@v2

    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-clang-x86_64-clang

    - name: Set LIBCLANG_PATH
      run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV

    - name: Ship
      shell: pwsh
      run: ./.github/workflows/shipper.ps1

#    - name: Compress binaries
#      uses: svenstaro/upx-action@v2
#      with:
#        args: -9
#        files: |
#          smoothie-rs-artifact/bin/smoothie*.exe
#          smoothie-rs-artifact/bin/vapoursynth64/plugins/*.dll

    - uses: actions/upload-artifact@v4
      with:
        name: smoothie-rs-bin-windows
        path: ./smoothie-rs/

    - name: Generate release tag
      id: tag
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "::set-output name=release_tag::Nightly_${env:BRANCH_NAME}_$(date +"%Y.%m.%d_%H-%M")"
        echo "::set-output name=short_sha::$(git rev-parse --short HEAD)"

    - name: Hash bundled SVPFlow plugins
      id: svphash
      shell: pwsh
      run: |
        "hashes<<EOF" >> $env:GITHUB_OUTPUT
        Get-FileHash ./smoothie-rs/bin/vs-plugins/svpflow*_vs.dll -Algorithm SHA256 |
          Sort-Object Path |
          ForEach-Object { "- ``$(Split-Path $_.Path -Leaf)``: ``$($_.Hash.ToLower())``" } >> $env:GITHUB_OUTPUT
        "EOF" >> $env:GITHUB_OUTPUT

    - uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        target_commitish: ${{ github.sha }}
        body: |
          Automated nightly build of **${{ github.ref_name }}** @ `${{ steps.tag.outputs.short_sha }}`

          - Branch: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          - Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          Bundled SVPFlow plugins ([Z1xus/open-svpflow](https://github.com/Z1xus/open-svpflow) `latest`):
          ${{ steps.svphash.outputs.hashes }}
        fail_on_unmatched_files: true
        files: |
          ./smoothie-rs-nightly.zip
